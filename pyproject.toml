[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["RUF012"]
[tool.ruff.lint.per-file-ignores]
"pipeline/enrichment/prompts.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["news", "pipeline"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
